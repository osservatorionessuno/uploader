<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Upload - Osservatorio Nessuno</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="stylesheet" href="/upload.css">
  </head>
  <body>
    <header class="header">
      <div class="header-title">
        <a class="header-logo" href="https://osservatorionessuno.org/">
          <img height="32px" src="/logo.svg" alt="logo-osservatorio-nessuno">
          <span>Osservatorio Nessuno</span>
        </a>
      </div>
    </header>
    <main class="wrapper">
      <section class="invert full sub">
        <div>
          <!-- Target of the no-JavaScript form on success. Static (no script, no server-side
               templating): the upload id is the `id` parameter of this page's address. -->
          <dialog class="ok" open>
            <div class="icon" aria-hidden="true"></div>
            <h2><span lang="it">File ricevuto</span><span lang="en">File received</span></h2>
            <p><span lang="it">Se ci contatti riguardo a questo file, indica l'identificativo che vedi
              nell'indirizzo di questa pagina, dopo <code>id=</code>.</span>
              <span lang="en">If you contact us about this file, please mention the id shown in this
              page's address, after <code>id=</code>.</span></p>
            <p><a class="button text" href="/"><span lang="it">Indietro</span><span lang="en">Back</span></a></p>
          </dialog>
        </div>
      </section>
    </main>
  </body>
</html>
