<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Upload - Osservatorio Nessuno</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="stylesheet" href="/upload.css">
  </head>
  <body>
    <header class="header">
      <div class="header-title">
        <a class="header-logo" href="https://osservatorionessuno.org/">
          <img height="32px" src="/logo.svg" alt="logo-osservatorio-nessuno">
          <span>Osservatorio Nessuno</span>
        </a>
      </div>
    </header>
    <main class="wrapper">
      <section class="invert full sub">
        <div>
          <!-- Body of the 403/404/410 answers under /dl/ (download links in notifications). Static. -->
          <dialog class="err" open>
            <div class="icon" aria-hidden="true"></div>
            <h2><span lang="it">Download non disponibile</span><span lang="en">Download unavailable</span></h2>
            <p><span lang="it">Il link non è valido, è scaduto, oppure il file è stato rimosso.</span>
              <span lang="en">The link is invalid or expired, or the file has been removed.</span></p>
          </dialog>
        </div>
      </section>
    </main>
  </body>
</html>
